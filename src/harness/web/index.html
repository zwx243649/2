<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Runs</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e0e4e9;
    --text: #1b1f24;
    --muted: #6b7280;
    --accent: #2563eb;
    --good: #15803d;
    --bad: #b91c1c;
    --code: #f2f4f7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  .num { font-variant-numeric: tabular-nums; font-family: ui-monospace, Consolas, monospace; }

  header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: 0; }
  header .agg { color: var(--muted); font-size: 12px; }

  .app {
    display: grid; grid-template-columns: minmax(280px, 360px) 1fr;
    height: calc(100% - 41px);
  }

  .list { border-right: 1px solid var(--border); overflow-y: auto; background: var(--panel); }
  .filters {
    display: flex; flex-wrap: wrap; gap: 5px;
    padding: 8px 10px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--panel); z-index: 1;
  }
  .chip {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel);
    cursor: pointer; color: var(--muted);
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .n { opacity: .7; }
  .row {
    display: grid; gap: 2px; padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer; border-left: 3px solid transparent;
  }
  .row:hover { background: #fafbfc; }
  .row.active { background: #eef4ff; border-left-color: var(--accent); }
  .row.baseline { border-left-color: var(--good); }
  .row.paused { background: #fffbf0; border-left-color: #d97706; }
  .row.paused.active { background: #fef3e2; }
  .row .goal {
    font-size: 12.5px; overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .row .meta { display: flex; gap: 10px; color: var(--muted); font-size: 11.5px; flex-wrap: wrap; }
  .tag {
    font-size: 10px; padding: 1px 5px; border-radius: 4px;
    background: #e8f5ec; color: var(--good); border: 1px solid #cfe8d8;
  }
  .tag.pending {
    background: #fef3e2; color: #b45309; border-color: #f5d9a8;
    font-weight: 600;
  }

  .detail { overflow-y: auto; padding: 14px 18px 40px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }

  h2 { font-size: 15px; margin: 0 0 6px; font-weight: 600; }
  h3 {
    font-size: 12px; margin: 18px 0 6px; font-weight: 600;
    color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
  }

  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; }
  .stat {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; min-width: 96px;
  }
  .stat .k { color: var(--muted); font-size: 11px; }
  .stat .v { font-size: 15px; }
  .delta { font-size: 11px; margin-left: 6px; }
  .delta.down { color: var(--good); }
  .delta.up { color: var(--bad); }
  .delta.same { color: var(--muted); }

  .baseline-bar {
    display: flex; align-items: center; gap: 8px;
    background: #eef7f1; border: 1px solid #cfe8d8; border-radius: 6px;
    padding: 6px 10px; margin-bottom: 10px; font-size: 12px;
  }

  button {
    font: inherit; font-size: 12px; padding: 3px 9px;
    border: 1px solid var(--border); background: var(--panel);
    border-radius: 5px; cursor: pointer; color: var(--text);
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  button.primary:hover { background: #1d4ed8; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }

  pre.out {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; margin: 0; white-space: pre-wrap; word-break: break-word;
    font: 12.5px/1.6 ui-monospace, Consolas, monospace;
  }

  .step {
    display: grid; grid-template-columns: 26px 92px 1fr; gap: 8px;
    padding: 5px 0; border-bottom: 1px solid #f0f2f5; align-items: start;
  }
  .step:last-child { border-bottom: none; }
  .step .idx { color: var(--muted); font-size: 11px; text-align: right; }
  .step .who { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .step .body { font-size: 12px; word-break: break-word; white-space: pre-wrap; }
  .kind {
    display: inline-block; font-size: 10px; padding: 0 4px; border-radius: 3px;
    background: var(--code); color: var(--muted); margin-right: 5px;
  }
  .kind.delegate { background: #eef4ff; color: var(--accent); }
  .kind.return { background: #f4f0ff; color: #6d28d9; }

  .span-row {
    display: grid; grid-template-columns: 90px 1fr; gap: 8px;
    font-size: 11.5px; padding: 2px 0; color: var(--muted);
  }
  .span-row .t { color: var(--text); }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 40% 60%; }
    .list { border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
<header>
  <h1>Harness Runs</h1>
  <span class="agg" id="agg">载入中…</span>
</header>

<div class="app">
  <div class="list">
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </div>
  <div class="detail" id="detail"><div class="empty">从左边的列表里选一次运行</div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let runs = [];
let sessions = [];
let baselineId = null;
let selectedId = null;
let filter = { type: "all", value: null };

const fmt = (n) => n >= 10000 ? (n / 1000).toFixed(1) + "k" : String(n);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function delta(now, base, lowerIsBetter = true) {
  if (base == null || base === 0 || now === base) return "";
  const pct = ((now - base) / base) * 100;
  const dir = now < base ? "down" : "up";
  const good = lowerIsBetter ? dir === "down" : dir === "up";
  const cls = Math.abs(pct) < 1 ? "same" : (good ? "down" : "up");
  const sign = pct > 0 ? "+" : "";
  return `<span class="delta ${cls}">${sign}${pct.toFixed(0)}%</span>`;
}

async function loadRuns(autoSelect = true) {
  const [runsRes, sessRes] = await Promise.all([
    fetch("/api/runs"),
    fetch("/api/sessions"),
  ]);
  runs = (await runsRes.json()).runs;
  sessions = (await sessRes.json()).sessions;
  const total = runs.reduce((s, r) => s + r.total_tokens, 0);
  const waiting = runs.filter((r) => r.status === "paused").length;
  $("agg").textContent = `${runs.length} 次运行 · 合计 ${fmt(total)} tokens` +
    (waiting ? ` · ${waiting} 个待批准` : "");
  renderFilters();
  renderList();
  if (autoSelect && runs.length) selectRun(runs[0].run_id);
}

function renderFilters() {
  const pendingCount = runs.filter((r) => r.status === "paused").length;
  const chips = [`<span class="chip ${filter.type === "all" ? "on" : ""}"
    data-kind="all" data-value="">全部 <span class="n">${runs.length}</span></span>`];

  if (pendingCount) {
    chips.push(`<span class="chip ${filter.type === "pending" ? "on" : ""}"
      data-kind="pending" data-value=""
      style="border-color:#f5d9a8;color:#b45309">待批准
      <span class="n">${pendingCount}</span></span>`);
  }

  for (const s of sessions) {
    const on = filter.type === "session" && filter.value === s.session_id;
    chips.push(`<span class="chip ${on ? "on" : ""}" data-kind="session"
      data-value="${esc(s.session_id)}" title="${esc(s.title)}">${esc(s.session_id)}
      <span class="n">${s.run_count}</span></span>`);
  }

  $("filters").innerHTML = chips.join("");
  $("filters").querySelectorAll(".chip").forEach((el) => {
    el.onclick = () => {
      filter = { type: el.dataset.kind, value: el.dataset.value || null };
      renderFilters();
      renderList();
    };
  });
}

function visibleRuns() {
  if (filter.type === "pending") return runs.filter((r) => r.status === "paused");
  if (filter.type === "session") {
    return runs.filter((r) => r.session_id === filter.value);
  }
  return runs;
}

function renderList() {
  const visible = visibleRuns();
  if (!visible.length) {
    $("list").innerHTML = '<div class="empty" style="padding:20px">没有匹配的运行</div>';
    return;
  }
  $("list").innerHTML = visible.map((r) => {
    const paused = r.status === "paused";
    const cls = [
      "row",
      paused ? "paused" : "",
      r.run_id === selectedId ? "active" : "",
      r.run_id === baselineId ? "baseline" : "",
    ].join(" ");
    const tag = r.run_id === baselineId ? '<span class="tag">基线</span>' : "";
    const sess = r.session_id && filter.type !== "session"
      ? `<span class="tag" style="background:#eef4ff;color:var(--accent);border-color:#dbe6ff">${esc(r.session_id)}</span>`
      : "";
    const waiting = paused && r.pending && r.pending.length
      ? `<span class="tag pending">待批准 ${esc(r.pending[0].tool || "")}</span>`
      : "";
    return `<div class="${cls}" data-id="${esc(r.run_id)}">
      <div class="goal">${esc(r.goal)}</div>
      <div class="meta">
        <span class="num">${esc(r.display_time)}</span>
        <span class="num">${r.model_calls} calls</span>
        <span class="num">${fmt(r.total_tokens)} tok</span>
        <span class="num">${r.duration_s.toFixed(1)}s</span>
        ${tag}
        ${waiting}
        ${sess}
      </div>
    </div>`;
  }).join("");

  $("list").querySelectorAll(".row").forEach((el) => {
    el.onclick = () => selectRun(el.dataset.id);
  });
}

async function selectRun(id) {
  selectedId = id;
  renderList();
  const res = await fetch("/api/runs/" + encodeURIComponent(id));
  if (!res.ok) {
    $("detail").innerHTML = `<div class="empty">读取失败：${esc((await res.json()).error)}</div>`;
    return;
  }
  renderDetail(await res.json());
}

function statBlock(label, value, deltaHtml = "") {
  return `<div class="stat"><div class="k">${label}</div>
    <div class="v num">${value}${deltaHtml}</div></div>`;
}

function renderDetail(data) {
  const s = data.summary;
  const base = baselineId && baselineId !== s.run_id
    ? runs.find((r) => r.run_id === baselineId) : null;
  const d = (key) => base ? delta(s[key], base[key]) : "";

  const bar = base
    ? `<div class="baseline-bar">对比基线：<b class="num">${esc(base.display_time)}</b>
         <span style="color:var(--muted)">${esc(base.goal.slice(0, 40))}</span>
         <button id="clear-base">清除基线</button></div>`
    : "";

  const pendingBlock = s.status === "paused" && s.pending && s.pending.length
    ? `<div class="baseline-bar" style="background:#fffbf0;border-color:#f5d9a8">
        <div style="flex:1">
          <b style="color:#b45309">⏸ 等待你批准</b>
          ${s.pending.map((p) => `<div style="margin-top:4px">
            <code>${esc(p.tool)} ${esc(p.arguments)}</code></div>`).join("")}
          <div style="margin-top:6px;color:var(--muted);font-size:11.5px">
            批准后会立刻继续这次运行（会调用模型，可能执行命令）。
          </div>
          <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
            <button id="btn-approve" class="primary">批准并继续</button>
            <button id="btn-reject">拒绝</button>
            <span id="action-msg" style="color:var(--muted);font-size:11.5px"></span>
          </div>
        </div>
      </div>`
    : "";

  const steps = data.transcript.map((e, i) => {
    const kind = e.kind === "ToolCallItem" ? '<span class="kind delegate">委派</span>'
      : e.kind === "ToolCallOutputItem" ? '<span class="kind return">回传</span>'
      : `<span class="kind">${esc(e.kind.replace("Item", ""))}</span>`;
    const body = e.kind === "ToolCallItem" ? `${esc(e.tool)}(${esc(e.arguments)})`
      : e.kind === "ToolCallOutputItem" ? esc(e.output)
      : esc(e.text || e.detail || "");
    return `<div class="step">
      <div class="idx num">${i + 1}</div>
      <div class="who">${esc(e.agent || "-")}</div>
      <div class="body">${kind}${body}</div>
    </div>`;
  }).join("") || '<div class="empty">没有记录</div>';

  const spans = data.spans.slice(-60).map((sp) => {
    const name = sp.name || "";
    const extra = sp.type === "generation" ? `[${esc(sp.model || "")}]`
      : sp.output ? esc(String(sp.output).slice(0, 100)) : "";
    return `<div class="span-row"><span class="t">${esc(sp.type || sp.class || "?")}</span>
      <span>${esc(name)} ${extra}</span></div>`;
  }).join("") || '<div class="empty">没有 span</div>';

  $("detail").innerHTML = `
    ${bar}
    ${pendingBlock}
    <h2>${esc(s.goal)}</h2>
    <div class="meta" style="color:var(--muted);font-size:12px">
      <span class="num">${esc(s.display_time)}</span> ·
      <span>最后处理者 ${esc(s.last_agent)}</span>
    </div>

    <div class="stats">
      ${statBlock("模型调用", s.model_calls, d("model_calls"))}
      ${statBlock("输入", fmt(s.input_tokens), d("input_tokens"))}
      ${statBlock("输出", fmt(s.output_tokens), d("output_tokens"))}
      ${statBlock("思维链", fmt(s.reasoning_tokens), d("reasoning_tokens"))}
      ${statBlock("缓存命中", fmt(s.cached_tokens))}
      ${statBlock("合计 tokens", fmt(s.total_tokens), d("total_tokens"))}
      ${statBlock("耗时", s.duration_s.toFixed(1) + "s", d("duration_s"))}
    </div>

    <h3>结论</h3>
    <pre class="out">${esc(data.final_output)}</pre>

    <h3>委派轨迹</h3>
    ${steps}

    <h3>内部 span</h3>
    ${spans}

    <div style="margin-top:18px;display:flex;gap:8px">
      <button id="set-base">${baselineId === s.run_id ? "已是基线" : "设为对比基线"}</button>
    </div>
  `;

  const clear = $("clear-base");
  if (clear) clear.onclick = () => { baselineId = null; renderList(); renderDetail(data); };
  $("set-base").onclick = () => { baselineId = s.run_id; renderList(); renderDetail(data); };

  const approveBtn = $("btn-approve");
  if (approveBtn) {
    approveBtn.onclick = () => runAction(s, "approve");
    $("btn-reject").onclick = () => runAction(s, "reject");
  }
}

async function runAction(summary, action) {
  const msg = $("action-msg");
  const buttons = [$("btn-approve"), $("btn-reject")];
  buttons.forEach((b) => { b.disabled = true; });
  msg.textContent = action === "approve"
    ? "已批准，正在继续运行…（可能要几十秒）"
    : "已拒绝，正在继续运行…";
  try {
    const res = await fetch(
      `/api/runs/${encodeURIComponent(summary.run_id)}/${action}`,
      { method: "POST", headers: { "X-Harness-Action": "1" } }
    );
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    msg.textContent = "完成，正在刷新…";
    await loadRuns(false);
    selectRun(data.run_id);
  } catch (err) {
    msg.textContent = "失败：" + err.message;
    buttons.forEach((b) => { b.disabled = false; });
  }
}

loadRuns();
</script>
</body>
</html>
