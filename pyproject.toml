[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-harness"
version = "0.1.0"
description = "Supervisor + worker multi-agent harness built on the openai-agents SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-agents==0.22.3",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
exclude = [".venv", "build", "dist", "runs", "workspace*", "evals/_out"]

[tool.ruff.lint]
# 不选 ARG：RunHooks / Model / signal handler 这些接口实现必然有用不上的参数
select = ["E", "W", "F", "B", "SIM", "C4", "PIE"]
ignore = [
    "E501", # 行长度由 line-length 管，不单独报
]

[tool.ruff.lint.per-file-ignores]
# 评估用例里的代码是**故意写坏的**，别拿常规标准要求它
"evals/tasks/**" = ["E", "F", "B", "SIM"]
